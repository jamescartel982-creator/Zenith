services:
  zenith:
    build: .
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      ZENITH_API_TOKEN: ${ZENITH_API_TOKEN:?Set a random ZENITH_API_TOKEN of at least 32 characters in .env}
      AI_PROVIDER: ${AI_PROVIDER:-ensemble}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      HF_REVISION: ${HF_REVISION:-7ae557604adf67be50417f59c2c2f167def9a775}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-256}
      CONTEXT_TOKENS: ${CONTEXT_TOKENS:-2048}
      ZENITH_HOME: /app/data/profile
      ZENITH_RESPONSE_MODE: ${ZENITH_RESPONSE_MODE:-fast}
      ZENITH_REPLY_STYLE: ${ZENITH_REPLY_STYLE:-auto}
      ZENITH_FAST_MAX_NEW_TOKENS: ${ZENITH_FAST_MAX_NEW_TOKENS:-96}
      ZENITH_FAST_HISTORY_TURNS: ${ZENITH_FAST_HISTORY_TURNS:-4}
      ZENITH_CPU_THREADS: ${ZENITH_CPU_THREADS:-4}
      TEMPERATURE: ${TEMPERATURE:-0.4}
      ZENITH_KNOWLEDGE_LIMIT: ${ZENITH_KNOWLEDGE_LIMIT:-3}
    volumes:
      - zenith-data:/app/data
      - zenith-models:/home/zenith/.cache/huggingface
    restart: unless-stopped
volumes:
  zenith-data:
  zenith-models:
