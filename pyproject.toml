[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-local"
dynamic = ["version"]
description = "Local open-model chat, reviewed learning, and an experimental from-scratch transformer"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["requests>=2.32,<3", "python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "argon2-cffi>=23.1,<26", "pyotp>=2.9,<3", "cryptography>=44,<48"]

[project.optional-dependencies]
data = ["datasets>=3,<5"]
local = ["torch>=2.6,<3", "transformers>=4.57.1,<5", "peft>=0.17,<0.19", "accelerate>=1,<2"]
train = ["torch>=2.6,<3", "transformers>=4.57.1,<5", "peft>=0.17,<0.19", "accelerate>=1,<2", "datasets>=3,<5"]
test = ["httpx>=0.27,<1"]

[project.scripts]
zenith = "agent.commands:main"
zenith-serve = "agent.server:main"

[tool.setuptools.packages.find]
include = ["agent*", "scripts*"]

[tool.setuptools.dynamic]
version = {attr = "agent.__version__"}

[tool.setuptools.package-data]
agent = ["web/*", "catalog/*.json", "model_packs/*.json", "resources/*", "evaluation/*.json"]
