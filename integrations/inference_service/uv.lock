provides-extras = ["native"]

[[package]]
name = "zenith-local"
source = { directory = "../../" }
dependencies = [
    { name = "argon2-cffi" },
    { name = "cryptography" },
    { name = "fastapi" },
    { name = "pyotp" },
    { name = "python-dotenv" },
    { name = "requests" },
    { name = "urllib3" },
    { name = "uvicorn" },
]

[package.optional-dependencies]
local = [
    { name = "accelerate" },
    { name = "peft" },
    { name = "setuptools" },
    { name = "torch", version = "2.14.1", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torch", version = "2.14.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "transformers" },
]

[package.metadata]
requires-dist = [
    { name = "accelerate", marker = "extra == 'local'", specifier = ">=1,<2" },
    { name = "accelerate", marker = "extra == 'train'", specifier = ">=1,<2" },
    { name = "argon2-cffi", specifier = ">=23.1,<26" },
    { name = "cryptography", specifier = ">=50.0.2,<51" },
    { name = "datasets", marker = "extra == 'data'", specifier = ">=5.0.1,<6" },
    { name = "datasets", marker = "extra == 'train'", specifier = ">=5.0.1,<6" },
    { name = "fastapi", specifier = ">=0.115,<1" },
    { name = "fsspec", extras = ["http"], marker = "extra == 'data'", specifier = ">=2026.6.0,<2027" },
    { name = "fsspec", extras = ["http"], marker = "extra == 'train'", specifier = ">=2026.6.0,<2027" },
    { name = "httpx", marker = "extra == 'test'", specifier = ">=0.27,<1" },
    { name = "peft", marker = "extra == 'local'", specifier = ">=0.18.1,<0.19" },
    { name = "peft", marker = "extra == 'train'", specifier = ">=0.18.1,<0.19" },
    { name = "pyotp", specifier = ">=2.9,<3" },
    { name = "python-dotenv", specifier = ">=1,<2" },
    { name = "requests", specifier = ">=2.34.2,<3" },
    { name = "setuptools", marker = "extra == 'local'", specifier = ">=84.1.0,<85" },
    { name = "setuptools", marker = "extra == 'train'", specifier = ">=84.1.0,<85" },
    { name = "torch", marker = "extra == 'local'", specifier = ">=2.6,<3" },
    { name = "torch", marker = "extra == 'train'", specifier = ">=2.6,<3" },
    { name = "transformers", marker = "extra == 'local'", specifier = ">=5.10.4,<5.11" },
    { name = "transformers", marker = "extra == 'train'", specifier = ">=5.10.4,<5.11" },
    { name = "urllib3", specifier = ">=2.8.0,<3" },
    { name = "uvicorn", specifier = ">=0.30,<1" },
]
provides-extras = ["data", "local", "train", "test"]
