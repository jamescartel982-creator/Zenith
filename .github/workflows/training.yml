name: Bounded starter training candidate
on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: CPU optimizer steps (1–200); candidate is never promoted automatically
        required: true
        default: '40'
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZENITH_HOME: ${{ github.workspace }}/.zenith-training
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      ZENITH_CPU_THREADS: '2'
      OMP_NUM_THREADS: '2'
      CAMPAIGN_STEPS: ${{ inputs.max_steps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate bounded step budget
        run: python -c "import os; n=int(os.environ['CAMPAIGN_STEPS']); assert 1 <= n <= 200, 'Use 1–200 steps'"
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[train]'
      - name: Train, evaluate held-out data, and compare task slices
        run: python -m scripts.run_training_campaign --output training-candidate --max-steps "$CAMPAIGN_STEPS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zenith-unpromoted-starter-candidate
          path: training-candidate/
          retention-days: 30
          if-no-files-found: error
