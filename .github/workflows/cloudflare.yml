name: Cloudflare gateway validation
on:
  pull_request:
    paths: ['agent/**', 'integrations/cloudflare/**', 'deploy/cloudflare/**', 'scripts/smoke_cloudflare.py', 'tests/test_cloudflare_origin.py', 'wrangler.jsonc', 'package*.json', '.node-version', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZENITH_HOME: ${{ github.workspace }}/.zenith-cloudflare-tests
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p test_cloudflare_origin.py -v
      - run: npm run check
      - run: python -m scripts.smoke_cloudflare --output cloudflare-local-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-local-validation
          path: cloudflare-*.json
