name: Four-system service deployment checks
on:
  pull_request:
    paths: ['deploy/four_system/**', '.github/workflows/four-system-services.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Service security regressions and native systemd verification
        run: python -m unittest discover -s deploy/four_system -v
