name: Zenith checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  container:
    name: Container package and server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zenith:ci .
      - run: docker run --rm --entrypoint zenith zenith:ci verify --json
      - run: docker run --rm --entrypoint python zenith:ci -m scripts.smoke_server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - run: python -m scripts.smoke_container --image zenith:ci
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      ZENITH_HOME: ${{ github.workspace }}/.zenith-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: zenith --version
      - run: zenith catalog --validate
      - run: zenith skills validate
      - run: zenith verify --source . --json
  install:
    name: Native install and inference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: Zenith workspace
    env:
      ZENITH_HOME: ${{ github.workspace }}/.zenith-installed
      ZENITH_PYTHON: python
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      ZENITH_CPU_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: Zenith workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Zenith workspace/pyproject.toml
      - name: Linux installer
        if: runner.os == 'Linux'
        run: bash install.sh --mode local
      - name: Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --mode local
      - name: Linux installed commands and cached-model inference
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install 'httpx>=0.27,<1'
          source ./activate.sh
          python -c "import sys; assert sys.prefix != sys.base_prefix"
          zenith discover list
          deactivate
          ./run.sh --version
          ./run.sh catalog --validate
          ./run.sh models download
          ./run.sh doctor --inference
          .venv/bin/python -m unittest discover -s tests -v
          if [ -f model_releases/recovery-v1/release.json ]; then
            .venv/bin/python -I -m scripts.smoke_model_release --bundle model_releases/recovery-v1
          fi
          .venv/bin/python -I -m scripts.check_research_checkpoint --bundle research_checkpoints/recovery-v1
          .venv/bin/python scripts/smoke_server.py
          .venv/bin/python scripts/smoke_easy_launch.py
          .venv/bin/python scripts/smoke_installed.py
      - name: Windows PowerShell 5.1 environment activation
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          . .\activate.ps1
          python -c "import sys; assert sys.prefix != sys.base_prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zenith discover list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          deactivate
          if ($env:VIRTUAL_ENV) { throw 'Environment was not deactivated' }
      - name: Windows installed commands and cached-model inference
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pip install 'httpx>=0.27,<1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\run.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./run.ps1 catalog --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./run.ps1 models download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./run.ps1 doctor --inference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path model_releases/recovery-v1/release.json) {
            .venv/Scripts/python.exe -I -m scripts.smoke_model_release --bundle model_releases/recovery-v1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          .venv/Scripts/python.exe -I -m scripts.check_research_checkpoint --bundle research_checkpoints/recovery-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/smoke_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/smoke_easy_launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/smoke_installed.py
          exit $LASTEXITCODE
