name: Skills scale and analysis UI
on:
  pull_request:
    paths: ['agent/**', 'scripts/productivity_benchmark.py', 'scripts/generated_recipes_acceptance.py', 'scripts/recipe_search_benchmark.py', 'scripts/smoke_productivity_ui.py', 'scripts/security_browser_acceptance.py', 'tests/test_security_hardening.py', 'tests/test_productivity.py', 'tests/test_skill_catalog.py', 'tests/test_generated_recipes.py', '.github/workflows/productivity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: Real 100k catalog, CSV and Chromium workflows
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ZENITH_HOME: ${{ github.workspace }}/.zenith-productivity-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: App and isolated browser test SDK
        run: python -m pip install -e '.[test]' playwright==1.64.1
      - name: Actual Chromium test runtime
        run: python -m playwright install --with-deps chromium --only-shell
      - name: Actual bounded catalog import and data analysis
        run: python -m scripts.productivity_benchmark --output productivity-scale.json
      - name: Real account, UI, CSV, preference and skill activation workflows
        run: python -m scripts.smoke_productivity_ui --output productivity-browser.json
      - name: Actual compact 100k generated recipe installation and persistence
        run: python -m scripts.generated_recipes_acceptance --output productivity-generated.json
      - name: Actual Chromium generated label, activation and account isolation
        run: python -m scripts.smoke_productivity_ui --generated-recipes --output productivity-generated-browser.json
      - name: Actual Chromium XSS, credential and stale owner-response boundaries
        run: python -m scripts.security_browser_acceptance --output productivity-security-browser.json
      - name: Paired exact-result recipe search benchmark against pinned baseline
        run: python -m scripts.recipe_search_benchmark --output productivity-search-plans.json --samples 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: productivity-acceptance
          path: productivity-*.json
