name: Skills scale and analysis UI
on:
  pull_request:
    paths: ['agent/**', 'scripts/productivity_benchmark.py', 'scripts/smoke_productivity_ui.py', 'tests/test_productivity.py', 'tests/test_skill_catalog.py', '.github/workflows/productivity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: Real 100k catalog, CSV and Chromium workflows
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ZENITH_HOME: ${{ github.workspace }}/.zenith-productivity-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: App and isolated browser test SDK
        run: python -m pip install -e '.[test]' playwright==1.64.1
      - name: Actual Chromium test runtime
        run: python -m playwright install --with-deps chromium --only-shell
      - name: Actual bounded catalog import and data analysis
        run: python -m scripts.productivity_benchmark --output productivity-scale.json
      - name: Real account, UI, CSV, preference and skill activation workflows
        run: python -m scripts.smoke_productivity_ui --output productivity-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: productivity-acceptance
          path: productivity-*.json
